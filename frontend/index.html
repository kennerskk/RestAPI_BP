<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMU Data Visualization</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-zoom/2.0.1/chartjs-plugin-zoom.min.js"></script>
</head>
<body>
  <div class="controls">
    <div class="control-group">
      <label>ระยะเวลาอัพเดท (วินาที):</label>
      <input type="number" id="intervalInput" value="2" min="0.5" step="0.5">
      <button class="btn-primary" onclick="updateInterval()">ตั้งค่า</button>
    </div>
    <button class="btn-danger" id="toggleBtn" onclick="toggleAutoUpdate()">⏸️ หยุดอัพเดท</button>
    <button class="btn-success" onclick="manualUpdate()">🔄 อัพเดทตอนนี้</button>
    <div id="status">อัพเดททุก 2 วินาที</div>
  </div>

  <div id="noData">ไม่มีข้อมูล</div>
  <div id="sections"></div>

  <script src="app.js"></script>
</body>
</html>
