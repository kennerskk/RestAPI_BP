<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <style>
    body{font-family:Segoe UI,Arial;background:#f5f5f5;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{background:#fff;padding:24px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.08);width:320px}
    input{width:100%;padding:8px;margin:8px 0;border:1px solid #ddd;border-radius:4px}
    button{width:100%;padding:10px;border:none;background:#2196F3;color:#fff;border-radius:4px;cursor:pointer}
    .error{color:#f44336;margin-top:8px;font-size:0.9em}
  </style>
</head>
<body>
  <div class="card">
    <h3>เข้าสู่ระบบ</h3>
    <input id="username" placeholder="username" />
    <input id="password" type="password" placeholder="password" />
    <button id="loginBtn">Login</button>
    <div id="err" class="error"></div>
  </div>

  <script>
    const API_LOGIN = '/api/auth/login';
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('err');
      errEl.textContent = '';
      try {
        const res = await fetch(API_LOGIN, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          redirect: 'follow'
        });

        const ct = res.headers.get('content-type') || '';
        if (ct.includes('application/json')) {
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Login failed');
          localStorage.setItem('token', data.token);
          window.location.href = '/api/stat/view';
        } else {
          const text = await res.text();
          const msg = res.ok ? 'Unexpected non-JSON response from server' : (text || `HTTP ${res.status}`);
          throw new Error(msg);
        }
      } catch (err) {
        errEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
